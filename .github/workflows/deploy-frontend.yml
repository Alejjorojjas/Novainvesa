name: Deploy Frontend a Hostinger

on:
  push:
    branches: [main]
    paths:
      - "Frontend/**"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: Frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: Frontend
        run: npm ci

      - name: Compilar frontend
        working-directory: Frontend
        run: npm run build
        env:
          VITE_API_URL: https://api-novainvesa.onrender.com
          VITE_META_PIXEL_ID: ${{ secrets.META_PIXEL_ID }}
          VITE_GA4_ID: ${{ secrets.GA4_ID }}
          VITE_WHATSAPP_NUMBER: ${{ secrets.WHATSAPP_NUMBER }}

      - name: Subir a Hostinger via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 21
          local-dir: ./Frontend/dist/
          server-dir: /public_html/
          dangerous-clean-slate: false
          timeout: 60000
          log-level: verbose
